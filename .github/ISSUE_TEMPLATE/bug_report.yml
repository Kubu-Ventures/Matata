name: Bug report
description: Something in Matata isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so a maintainer can reproduce it.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Public reporter flow (report submission, login)
        - Analyst portal
        - PWA / offline behavior
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 128 on Android 14
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console errors / screenshots
      description: Paste any console output, network errors, or attach screenshots.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Was this offline? A specific locale? Anything else relevant.
    validations:
      required: false
